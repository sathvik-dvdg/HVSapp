version: "3.9"

services:
  backend:
    build:
      context: .
    env_file:
      - .env
    secrets:
      - gcp_credentials
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp_credentials.json
      FIREBASE_CREDENTIALS_PATH: /run/secrets/gcp_credentials.json
    ports:
      - "8000:8000"

secrets:
  gcp_credentials:
    file: ./gcp_credentials.json
